apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-sample-python-app
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
  - list:
      elements:
          - environment: dev
            targetRevision: v0.0.52
            cluster: in-cluster
          - environment: prd
            targetRevision: v0.0.52
            cluster: aks-cluster-dev-eus-02
  template:
    metadata:
      name: sample-python-app-{{ .environment }}
    spec:
      project: apps-sample-python-app
      sources:
        - repoURL: https://github.com/pandeyaws/sample-python-app.git
          targetRevision: '{{ .targetRevision }}'
          path: helm/sample-python-app
          helm:
            valueFiles:
              - values.yaml
              - values/{{ .environment }}.yaml
            parameters:
              - name: image.tag
                value: '{{ .targetRevision }}'        
      destination:
        name: '{{ .cluster }}'
        namespace: 'sample-python-app-{{ .environment }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - serversideApply=true
          