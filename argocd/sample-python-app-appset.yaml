apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sample-python-app
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
  - list:
      elements:
          - environment: dev
            targetRevision: v0.0.47
            server: https://kubernetes.default.svc
          - environment: prd
            targetRevision: v0.0.47
            server: https://scf-aks-dev-mms8s86a.hcp.eastus.azmk8s.io:443
  template:
    metadata:
      name: sample-python-app-{{ .environment }}
    spec:
      project: apps-sample-python-app
      sources:
        - repoURL: https://github.com/pandeyaws/sample-python-app.git
          targetRevision: '{{ .targetRevision }}'
          path: helm/sample-python-app
          helm:
            valueFiles:
              - values.yaml
              - values/{{ .environment }}.yaml
            parameters:
              - name: image.tag
                value: '{{ .targetRevision }}'
        
      destination:
        server: '{{ .server }}'
        namespace: '{{ .environment }}-sample-python-app'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - serversideApply=true
          